        '<td class="num">'+money(x.balance)+'</td>'+
        '<td class="mini">'+esc(x.pmes_job_code||'—')+'</td></tr>'}).join('')+'</tbody></table>'
       :'<div class="empty">No gates yet.</div>')+'</div>';

/* One call to HATID. Retries twice on its own (network hiccups), then says what went wrong. */
async function lgCall(what,args){
  var s=await supa.auth.getSession(); var tok=s.data.session&&s.data.session.access_token;
  if(!tok) throw new Error('Sign in again to see logistics.');
  var last;
  for(var i=0;i<3;i++){
    try{
      var r=await fetch(HATID_FEED,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+tok},
        body:JSON.stringify({what:what,args:args||{}})});
      var j=await r.json().catch(function(){return {}});
      if(r.ok){LG.me=j.me||LG.me;return j.data}
      last=new Error(j.error||('HATID answered '+r.status));
      if(r.status<500) throw last;          // a clear "no" — retrying will not change it
    }catch(e){last=e; if(e&&e.message&&/sign|verified|company|can.t see|not open/i.test(e.message)) throw e}
    await new Promise(function(ok){setTimeout(ok,700*(i+1))});
  }
  throw last||new Error('Could not reach HATID.');
}

  VIEW(_vs).innerHTML='<div class="card"><div class="row" style="justify-content:space-between"><div><h3>Map · '+esc(lgDay(LG.date||(LG.ov&&LG.ov.today)))+'</h3>'+
    '<p class="sub" style="margin:0">Trucks where their tracker last reported, the day’s drop sites and the plants. Tap a truck for its route today.</p></div><span id="lgUpdWrap"></span></div></div>'+
    '<div class="lg-mapwrap"><div id="lgMap"></div><div id="lgMapList" class="lg-maplist"></div></div>';
  var ml;
  try{ var r=await Promise.all([lgLoadMap(),lgLoad(false,LG.date)]); ml=r[0] }catch(e){ return lgFail(e,'lg_map') }
  var M=LG.map={m:new ml.Map({container:'lgMap',style:'https://tiles.openfreemap.org/styles/liberty',center:[121.0,14.6],zoom:9}),mk:{},fitted:false,focus:null};
  M.m.addControl(new ml.NavigationControl({showCompass:false}),'top-left');
  M.m.on('load',function(){ M.loaded=true;
    M.m.addSource('trail',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
    M.m.addLayer({id:'trail',type:'line',source:'trail',paint:{'line-color':'#2b6cb0','line-width':4,'line-opacity':.8}});
    if(M.focus) lgTrail(M.focus);
  });
  lgDrawMap();
  if(LG.mapFocus){var f=LG.mapFocus;LG.mapFocus=null;setTimeout(function(){lgFocusTruck(f)},300)}
  lgLive(async function(){ try{ await lgLoad(true,LG.date); lgDrawMap(); if(M.focus) lgTrail(M.focus) }catch(e){} });
}
function lgMarker(key,lngLat,html,cls,onClick){
  var M=LG.map; var mk=M.mk[key];
  if(!mk){var d=document.createElement('div');d.className='lg-mk '+(cls||'');d.innerHTML=html;
    if(onClick) d.addEventListener('click',function(ev){ev.stopPropagation();onClick()});
    mk=M.mk[key]=new maplibregl.Marker({element:d,anchor:'bottom'}).setLngLat(lngLat).addTo(M.m)}
  else{mk.setLngLat(lngLat);mk.getElement().className='lg-mk '+(cls||'');mk.getElement().innerHTML=html}
  mk._seen=true; return mk;
}
function lgPopup(lngLat,html){var M=LG.map;if(M.pop)M.pop.remove();M.pop=new maplibregl.Popup({offset:28,maxWidth:'300px'}).setLngLat(lngLat).setHTML(html).addTo(M.m)}
function lgDrawMap(){
  var M=LG.map, ov=LG.ov; if(!M||!ov) return;
  var w=el('lgUpdWrap'); if(w) w.innerHTML=lgUpdated();
  Object.keys(M.mk).forEach(function(k){M.mk[k]._seen=false});
  var pts=[];
  (ov.pools||[]).forEach(function(p){ if(p.base_lat==null) return;
    lgMarker('b'+p.id,[p.base_lon,p.base_lat],'<span class="lg-base"><i class="ti ti-building-factory-2"></i></span>','',function(){
      lgPopup([p.base_lon,p.base_lat],'<b>'+esc(p.origin||p.name)+'</b><br>'+esc((p.companies||[]).join(' · ')))}); });
  var jobs=(ov.jobs||[]).filter(function(j){return j.lat!=null&&j.lon!=null});
  jobs.forEach(function(j){ pts.push([j.lon,j.lat]);
    lgMarker('j'+j.id,[j.lon,j.lat],'<svg viewBox="0 0 24 34" width="22" height="31"><path d="M12 1C6 1 1.5 5.5 1.5 11.3c0 7.6 10.5 21.2 10.5 21.2s10.5-13.6 10.5-21.2C22.5 5.5 18 1 12 1z" fill="'+(LG_PIN[j.status]||'#5a6b7d')+'" stroke="#fff" stroke-width="2"/><circle cx="12" cy="11.5" r="4" fill="#fff"/></svg>','',function(){
      lgPopup([j.lon,j.lat],'<b>'+esc(j.client||'')+'</b><br>'+esc(j.serial||'')+(j.so?' · SO '+esc(j.so):'')+'<br>'+esc(j.truck||'')+(j.truck?' · trip '+j.trip_no:'')+
        '<br>'+esc((LG_STATUS[j.status]||[j.status])[0])+(j.last?' — '+esc(lgEvText(j.last))+' '+esc(lgTime(j.last.at)):'')+
        '<br><a href="#" data-act="lgJob" data-id="'+esc(j.id)+'">Details</a>')}); });
  var dayTrucks={}; (ov.jobs||[]).forEach(function(j){if(j.truck_id)dayTrucks[j.truck_id]=1});
  (ov.trucks||[]).forEach(function(t){ var p=t.pos; if(!p) return; var s=lgPosState(p);
    if(s!=='old') pts.push([p.lon,p.lat]);
    lgMarker('t'+t.id,[p.lon,p.lat],'<span class="lg-truck '+s+(M.focus===t.id?' focus':'')+'"><i class="ti ti-truck"></i></span><span class="lg-tl-lab">'+esc(t.label||'')+'</span>','',function(){lgFocusTruck(t.id)}); });
  Object.keys(M.mk).forEach(function(k){if(!M.mk[k]._seen){M.mk[k].remove();delete M.mk[k]}});
  if(!M.fitted&&pts.length){M.fitted=true;var b=new maplibregl.LngLatBounds();pts.forEach(function(x){b.extend(x)});M.m.fitBounds(b,{padding:60,maxZoom:13,duration:0})}
  var list=(ov.trucks||[]).filter(function(t){return t.pos||dayTrucks[t.id]}).sort(function(a,b){return (dayTrucks[b.id]?1:0)-(dayTrucks[a.id]?1:0)||String(a.label).localeCompare(String(b.label))});
  el('lgMapList').innerHTML='<div class="mini" style="padding:6px 8px">Trucks</div>'+(list.length?list.map(function(t){var s=lgPosState(t.pos);
    var n=(ov.jobs||[]).filter(function(j){return j.truck_id===t.id}), dn=n.filter(function(j){return j.status==='completed'}).length;
    return '<div class="lg-ml'+(M.focus===t.id?' on':'')+'" data-act="lgFocus" data-id="'+esc(t.id)+'"><span class="lg-dotc '+s+'"></span><div><b>'+esc(t.label||'')+'</b>'+
      '<div class="mini">'+(t.pos?(s==='mv'?'moving '+Math.round(t.pos.speed)+' km/h · ':'')+'seen '+esc(lgAgo(t.pos.at)):(t.tracked?'tracker silent':'no tracker'))+
      (n.length?' · '+dn+'/'+n.length+' drops':'')+'</div></div></div>'}).join(''):'<div class="empty">No trucks reporting.</div>');
}
function lgFocusTruck(id){
  var M=LG.map; if(!M) return; M.focus=id; lgDrawMap();
  var t=((LG.ov&&LG.ov.trucks)||[]).filter(function(x){return x.id===id})[0];
  if(t&&t.pos){M.m.flyTo({center:[t.pos.lon,t.pos.lat],zoom:13});
    lgPopup([t.pos.lon,t.pos.lat],'<b>'+esc(t.label||'')+'</b>'+(t.plate&&t.plate!==t.label?' · '+esc(t.plate):'')+'<br>Seen '+esc(lgAgo(t.pos.at))+
      (t.pos.speed>=5?' · '+Math.round(t.pos.speed)+' km/h':'')+'<br><span class="mini">Blue line: route today</span>')}
  if(M.loaded) lgTrail(id);
}
async function lgTrail(id){
  var M=LG.map; if(!M||!M.loaded) return;
  var pts=[]; try{ pts=await lgCall('trail',{truck:id,date:LG.date||(LG.ov&&LG.ov.today)}) }catch(e){}
  if(!LG.map||LG.map!==M) return;
  M.m.getSource('trail').setData({type:'FeatureCollection',features:pts.length>1?[{type:'Feature',geometry:{type:'LineString',coordinates:pts.map(function(p){return [p[0],p[1]]})}}]:[]});
}

/* ---------- CLIENT MESSAGES: everything HATID sent to and received from clients ---------- */
async function viewLgMsgs(){
  var _vs=render._seq;   // this page's ticket — see VIEW()
  if(LG.me&&!LG.me.messages){VIEW(_vs).innerHTML='<div class="card"><h3>Client messages</h3><div class="empty">Client messages are open to KEYSTONE Admins, Directors and Managers.</div></div>';return}
  if(!LG.msgs) VIEW(_vs).innerHTML='<div class="empty">Loading client messages from HATID…</div>';
  try{ await lgLoadMsgs() }catch(e){ return lgFail(e,'lg_msgs') }
  lgDrawMsgs();
  lgLive(async function(){ try{ await lgLoadMsgs(); lgDrawMsgs(true) }catch(e){} });
}
async function lgLoadMsgs(){
  var d=await lgCall('messages'); var J={}; (d.jobs||[]).forEach(function(j){J[j.id]=j});
  var T={}; function th(id){return T[id]||(T[id]={id:id,job:J[id]||null,items:[],unread:0,last:0})}
  (d.out||[]).forEach(function(o){th(o.job_id).items.push(Object.assign({dir:'out'},o))});
  (d['in']||[]).forEach(function(m){var t=th(m.job_id||'unmatched');t.items.push(Object.assign({dir:'in'},m));if(!m.read)t.unread++});
  Object.keys(T).forEach(function(k){var t=T[k];t.items.sort(function(a,b){return new Date(a.at)-new Date(b.at)});t.last=t.items.length?new Date(t.items[t.items.length-1].at).getTime():0});
  LG.msgs={T:T,at:Date.now()}; LG.at=LG.at||Date.now();
}
function lgDrawMsgs(keep){ if(TAB!=='lg_msgs') return;
  var T=LG.msgs.T, q=(LG.msgQ||'').toLowerCase();
  var list=Object.keys(T).map(function(k){return T[k]}).sort(function(a,b){return b.last-a.last}).filter(function(t){
    if(!q) return true; var j=t.job||{}; return [j.client,j.serial,j.contact,j.phone].concat(t.items.map(function(i){return i.body})).join(' ').toLowerCase().indexOf(q)>=0});
  if(!keep||!el('lgThreads')){
    el('view').innerHTML='<div class="card"><div class="row" style="justify-content:space-between"><div><h3>Client messages</h3>'+
      '<p class="sub" style="margin:0">The last 60 days of updates HATID sent to clients and agents, and their replies. Replies are answered in HATID.</p></div>'+
      '<span class="mini" id="lgUpd"><span class="lg-dot"></span> Live · updated '+esc(lgTime(new Date(LG.msgs.at).toISOString()))+'</span></div>'+
      '<input id="lgMsgQ" placeholder="Search client, SO, number, text…" value="'+esc(LG.msgQ||'')+'" style="margin-top:12px"></div>'+
      '<div class="lg-msgs"><div id="lgThreads" class="card" style="margin:0;padding:6px"></div><div id="lgThread" class="card" style="margin:0"></div></div>';
    el('lgMsgQ').oninput=function(){LG.msgQ=this.value;lgDrawMsgs(true)};
  } else { var u=el('lgUpd'); if(u) u.innerHTML='<span class="lg-dot"></span> Live · updated '+esc(lgTime(new Date(LG.msgs.at).toISOString())) }
  el('lgThreads').innerHTML=list.length?list.map(function(t){var j=t.job, last=t.items[t.items.length-1]||{};
    return '<div class="lg-th'+(LG.msgOpen===t.id?' on':'')+'" data-act="lgThread" data-id="'+esc(t.id)+'"><div class="row" style="justify-content:space-between;gap:6px">'+
      '<b>'+esc(j?j.client||j.serial:t.id==='unmatched'?'Not matched to a delivery':'Delivery')+'</b>'+(t.unread?'<span class="tabcount">'+t.unread+'</span>':'')+'</div>'+
      '<div class="mini">'+(j?esc(j.serial)+' · '+esc(j.company):'')+' · '+esc(lgDT(last.at))+'</div>'+
      '<div class="mini lg-clip">'+(last.dir==='in'?'↩ ':'')+esc(String(last.body||last.subject||'').slice(0,120))+'</div></div>'}).join('')
    :'<div class="empty">No client messages in the last 60 days.</div>';
  var open=LG.msgOpen&&T[LG.msgOpen]?T[LG.msgOpen]:null;
  el('lgThread').innerHTML=open?('<div class="row" style="justify-content:space-between"><div><h3 style="margin:0">'+esc(open.job?open.job.client||open.job.serial:'Not matched to a delivery')+'</h3>'+
      (open.job?'<p class="sub" style="margin:0">'+esc(open.job.serial)+' · '+esc(lgDay(open.job.date))+(open.job.contact||open.job.phone?' · '+esc([open.job.contact,open.job.phone].filter(Boolean).join(' · ')):'')+'</p>':'')+'</div>'+
      (open.job?'<button class="ghost lg-sm" data-act="lgJob" data-id="'+esc(open.job.id)+'">Delivery</button>':'')+'</div>'+
      lgThreadHtml(open.items))
    :'<div class="empty">Pick a conversation.</div>';
}
function lgThreadHtml(items){
  if(!items||!items.length) return '<div class="mini">No messages.</div>';
  return '<div class="lg-bubbles">'+items.map(function(m){
    var head=m.dir==='in'?'↩ '+esc(m.from||'Client')+' · '+esc(LG_CH[m.channel]||m.channel||'')
      :esc(LG_OB[m.kind]||m.kind||'Message')+' → '+esc(m.to||m.to_role||'')+' · '+esc(LG_CH[m.channel]||m.channel||'')+
        (m.status&&m.status!=='sent'?' · <span style="color:'+(m.status==='failed'?'var(--red-ink)':'var(--amber-ink)')+'">'+esc(m.status)+'</span>':'');
    return '<div class="lg-b '+(m.dir==='in'?'in':'out')+'"><div class="mini">'+head+' · '+esc(lgDT(m.at))+'</div>'+
      (m.subject&&m.channel==='email'?'<div><b>'+esc(m.subject)+'</b></div>':'')+'<div class="lg-body">'+esc(m.body||'')+'</div></div>'}).join('')+'</div>';
}

/* Dashboard card: the day at a glance. */
function lgDashCard(){
  var ov=LG.ov;
  if(!ov) return LG.err?'<div class="card"><h3>Logistics today</h3><div class="mini">HATID could not be reached: '+esc(LG.err)+'</div></div>':'';
  var jobs=(ov.jobs||[]); if(ov.date!==ov.today) return '';
  var done=jobs.filter(function(j){return j.status==='completed'}).length;
  var road=jobs.filter(function(j){return j.status==='dispatched'||j.status==='in_progress'}).length;
  var probs=jobs.filter(function(j){return j.status==='issue'||(j.last&&(j.last.type==='issue'||j.last.type==='delay')&&j.status!=='completed')}).length;
  var pend=(ov.schedules||[]).filter(function(s){return LG_STEP_FOR[s.status]&&s.date>=ov.today}).length;
  return '<div class="card"><div class="row" style="justify-content:space-between"><h3>Logistics today</h3>'+
    '<button class="ghost lg-sm" data-act="go" data-tab="lg_live">Open</button></div><p class="sub">Live from HATID · '+esc(lgDay(ov.today))+'</p>'+
    '<div class="grid g4 lg-kpis">'+kpi('Drops today',jobs.length,'scheduled for today')+kpi('On the road / on site',road,'')+
    kpi('Delivered',done,jobs.length?Math.round(done/jobs.length*100)+'%':'')+
    '<div class="kpi'+(probs?' lg-bad':'')+'"><div class="lbl">Problems &amp; delays</div><div class="val">'+probs+'</div><div class="hint">'+(pend?pend+' schedule'+(pend===1?'':'s')+' still being signed':'')+'</div></div></div></div>';
}
