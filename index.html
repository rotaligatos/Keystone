<!DOCTYPE html>
<html lang="en">
<head>

<title>KEYSTONE — Purchasing &amp; Production Release</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
:root{
  --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
  --text:#e7e9ee; --text2:#9aa3b2; --accent:#4f8cff; --accent-ink:#bcd4ff;
  --green:#2ea86b; --green-ink:#8ef0bd; --amber:#d99a2b; --amber-ink:#ffd894;
  --red:#d8524d; --red-ink:#ffb3b0; --teal:#1f9c9c; --teal-ink:#9ff0f0;
  --violet:#7c6ce0; --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--accent-ink)}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:8px 14px;
  background:var(--panel2);color:var(--text);border:1px solid var(--line)}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.danger{background:var(--red);color:#fff;border-color:var(--red)}
button.ghost{background:transparent}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;background:var(--panel2);color:var(--text);
  border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
label{display:block;font-size:12px;color:var(--text2);margin:10px 0 4px}
.wrap{max-width:1360px;margin:0 auto;padding:0 18px 80px}
header.top{position:sticky;top:0;z-index:40;background:rgba(15,17,21,.92);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topin{max-width:1360px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px}
.brand{font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:9px}
.brand i{color:var(--accent)}
.brand-t{display:flex;flex-direction:column;line-height:1.05}
.brand-n{font-size:24px;letter-spacing:1.5px}
.brand-s{font-size:10.5px;font-weight:500;opacity:.8;letter-spacing:.2px;white-space:nowrap}
.spacer{flex:1}
.who{font-size:12px;color:var(--text2);text-align:right;line-height:1.35}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding:0 18px;max-width:1360px;margin:0 auto}
nav.tabs button{background:transparent;border:0;border-bottom:2px solid transparent;
  border-radius:0;padding:10px 13px;color:var(--text2);white-space:nowrap}
nav.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;margin:14px 0}
.card h3{margin:0 0 4px;font-size:15px}
.sub{color:var(--text2);font-size:12.5px;margin:0 0 12px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--text2);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px}
tbody tr:hover{background:var(--panel2)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;
  font-weight:600;border:1px solid;white-space:nowrap}
.p-grey{color:var(--text2);border-color:var(--line);background:var(--panel2)}
.p-blue{color:var(--accent-ink);border-color:#2c4a80;background:#16233a}
.p-green{color:var(--green-ink);border-color:#1f6b47;background:#10261c}
.p-amber{color:var(--amber-ink);border-color:#7a5a17;background:#2a2110}
.p-red{color:var(--red-ink);border-color:#7d3330;background:#2c1615}
.p-teal{color:var(--teal-ink);border-color:#186767;background:#0f2626}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.kpi .lbl{font-size:11.5px;color:var(--text2);text-transform:uppercase;letter-spacing:.4px}
.kpi .val{font-size:23px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .hint{font-size:11.5px;color:var(--text2);margin-top:2px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;
  align-items:center;justify-content:center;z-index:80;padding:18px}
.modal.on{display:flex}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  width:min(760px,100%);max-height:88vh;overflow:auto;padding:20px}
.modal h3{margin:0 0 10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.right{justify-content:flex-end}
pre.prev{background:#0b0d11;border:1px solid var(--line);border-radius:10px;padding:12px;
  font-size:12px;overflow:auto;max-height:320px;color:var(--accent-ink);white-space:pre-wrap}
.empty{color:var(--text2);text-align:center;padding:30px 10px;font-size:13px}
.warn{background:#2a2110;border:1px solid #7a5a17;color:var(--amber-ink);
  border-radius:10px;padding:10px 12px;font-size:12.5px;margin:10px 0}
.info{background:#16233a;border:1px solid #2c4a80;color:var(--accent-ink);
  border-radius:10px;padding:10px 12px;font-size:12.5px;margin:10px 0}
.bar{height:7px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:6px;
  border:1px solid var(--line)}
.bar > i{display:block;height:100%;background:var(--green)}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:99;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 16px;
  font-size:13px;display:none;max-width:min(660px,92vw);box-shadow:0 8px 30px rgba(0,0,0,.5)}
#toast.err{border-color:var(--red);color:var(--red-ink)}
#toast.ok{border-color:var(--green);color:var(--green-ink)}
.buildbar{background:#3a2a08;border-bottom:1px solid #7a5a17;color:var(--amber-ink);
  padding:7px 18px;font-size:12.5px;display:flex;align-items:center;gap:10px;justify-content:center;
  flex-wrap:wrap}
.buildbar b{color:#ffe9bd}
.gate{border:1px solid var(--line);border-radius:12px;padding:13px;background:var(--panel2)}
.mini{font-size:12px;color:var(--text2)}
.stack{display:flex;flex-direction:column;gap:3px}
@media(max-width:640px){.topin{flex-wrap:wrap}.who{text-align:left}}
.card{overflow-x:auto}
@media(max-width:640px){.brand-n{font-size:20px}.brand-s{font-size:9px;white-space:normal;max-width:34vw}.brand svg{width:26px;height:26px}.rtmo-logo{height:32px!important;margin-right:6px!important}.topin{gap:8px;padding:8px 12px}.who{display:none}nav.tabs{padding:0 8px}}
nav.subtabs{border-top:1px solid var(--line)}
nav.subtabs button{padding:7px 12px;font-size:13px}
.tabcount{display:inline-block;min-width:18px;padding:0 6px;margin-left:4px;border-radius:9px;background:var(--amber-ink,#f0b44c);color:#1a1300;font-size:11px;font-weight:700;line-height:17px;text-align:center}
.needs .kpi{cursor:pointer}
.needs .kpi.act{border-color:var(--amber-ink,#f0b44c)}
.rtmo-logo{height:44px;width:auto;background:#fff;border-radius:7px;padding:2px 6px;margin-right:12px}
/* Logistics (HATID view) */
.lg-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:4px;animation:lgpulse 2s infinite}
@keyframes lgpulse{50%{opacity:.35}}
.lg-row{cursor:pointer}
.lg-badrow td{background:#2c1615}
.lg-me td{background:#2a2110}
.pk-alarm-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:80;background:#3a1412;color:var(--red-ink);border:1px solid var(--red);border-radius:12px;padding:10px 16px;cursor:pointer;box-shadow:0 6px 24px rgba(0,0,0,.45);max-width:min(720px,calc(100% - 24px));font-size:14px}
.kpi.lg-bad{border-color:var(--red)}.kpi.lg-bad .val{color:var(--red-ink)}
button.lg-sm{padding:4px 10px;font-size:12px}
a.lg-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;background:var(--accent);color:#fff;text-decoration:none;font-weight:600;font-size:13px;white-space:nowrap}
a.lg-btn:hover{filter:brightness(1.1)}
.lg-step{display:inline-block;width:20px;height:20px;line-height:18px;text-align:center;border-radius:50%;border:1px solid var(--line);font-size:11px;color:var(--text2);margin-right:3px}
.lg-step.on{background:#10261c;border-color:#1f6b47;color:var(--green-ink)}
.lg-stepper{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.lg-stepper>div{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;background:var(--panel2);font-size:13px}
.lg-stepper>div.done{border-color:#1f6b47;background:#10261c}.lg-stepper>div.now{border-color:#7a5a17;background:#2a2110}
.lg-sec{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0;background:var(--panel2)}
.lg-sec table td,.lg-sec table th{padding:6px 8px}
ul.lg-tl{list-style:none;margin:8px 0 0;padding:0 0 0 14px;border-left:2px solid var(--line)}
ul.lg-tl li{position:relative;padding:4px 0 10px 8px;font-size:13px}
ul.lg-tl li:before{content:"";position:absolute;left:-21px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--panel2);border:2px solid var(--text2)}
ul.lg-tl li.ok:before{border-color:var(--green);background:var(--green)}ul.lg-tl li.bad:before{border-color:var(--red);background:var(--red)}
ul.lg-tl li.unread:before{border-color:var(--amber);background:var(--amber)}
.lg-mapwrap{display:grid;grid-template-columns:1fr 260px;gap:12px;height:calc(100vh - 260px);min-height:420px}
#lgMap{border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);min-height:380px}
.lg-maplist{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:auto}
.lg-ml{display:flex;gap:9px;align-items:flex-start;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
.lg-ml:hover,.lg-ml.on{background:var(--panel2)}
.lg-dotc{width:10px;height:10px;border-radius:50%;margin-top:5px;flex:none;background:#6b7280}
.lg-dotc.mv{background:#2ea86b}.lg-dotc.st{background:#4f8cff}.lg-dotc.old,.lg-dotc.none{background:#6b7280}
.lg-mk{cursor:pointer;display:flex;flex-direction:column;align-items:center}
.lg-truck{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:#4f8cff;color:#fff;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4);font-size:17px}
.lg-truck.mv{background:#2ea86b}.lg-truck.old{background:#6b7280}.lg-truck.focus{outline:3px solid #f0b44c}
.lg-tl-lab{background:#fff;color:#111;font-size:10.5px;font-weight:700;border-radius:4px;padding:0 4px;margin-top:2px;white-space:nowrap}
.lg-base{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:7px;background:#1e3a5f;color:#fff;border:2px solid #fff;font-size:17px}
.maplibregl-popup-content{color:#111;font-size:13px}.maplibregl-popup-content a{color:#1d4ed8}
.lg-msgs{display:grid;grid-template-columns:320px 1fr;gap:12px;margin:14px 0}
#lgThreads{max-height:70vh;overflow:auto}
.lg-th{padding:9px 10px;border-radius:8px;cursor:pointer;border-bottom:1px solid var(--line)}
.lg-th:hover,.lg-th.on{background:var(--panel2)}
.lg-clip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg-bubbles{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.lg-b{max-width:82%;border:1px solid var(--line);border-radius:12px;padding:8px 11px;background:var(--panel2)}
.lg-b.in{align-self:flex-start;border-color:#186767;background:#0f2626}
.lg-b.out{align-self:flex-end}
.lg-body{white-space:pre-wrap;font-size:13px;margin-top:3px}
.lg-latest-m{display:none;margin-top:4px}
@media(max-width:640px){.lg-addr,.lg-latest{display:none}.lg-latest-m{display:block}.lg-kpis{grid-template-columns:1fr 1fr}
  .lg-kpis .kpi{padding:10px}.lg-kpis .kpi .val{font-size:19px}}
@media(max-width:760px){.lg-mapwrap{grid-template-columns:1fr;height:auto}#lgMap{height:60vh}.lg-maplist{max-height:40vh}
  .lg-msgs{grid-template-columns:1fr}.lg-stepper{grid-template-columns:repeat(2,1fr)}}
</style>

<body>

<header class="top">
  <div class="topin">
    <img src="rtmo-logo.png" alt="RTmo Digital Solutions" title="RTmo Digital Solutions" class="rtmo-logo">
    <div class="brand">
      <svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true">
        <path d="M7.6 4h8.8l3.1 16H4.5z" fill="none" stroke="var(--accent)" stroke-width="1.9"
              stroke-linejoin="round"/>
        <path d="M9.9 9.3h4.2M9.4 13.6h5.2" stroke="var(--accent)" stroke-width="1.6"
              stroke-linecap="round" opacity=".55"/>
      </svg><span class="brand-t"><span class="brand-n">KEYSTONE</span><span class="brand-s" id="envPill">Purchasing &amp; Production Release</span></span></div>
    <div class="spacer"></div>
    <div class="who" id="who">Not signed in</div>
    <button id="authBtn" class="primary">Sign in with Google</button>
  </div>
  <nav class="tabs" id="tabs"></nav>
  <nav class="tabs subtabs" id="subtabs" style="display:none"></nav>
</header>
<div id="buildbar"></div>

<div class="wrap" id="view"><div class="empty">Sign in to continue.</div></div>

<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ==========================================================================
   KEYSTONE — purchasing, sourcing, and the Modcraft → PMES payment gate.
   Named for the wedge stone that locks an arch: nothing reaches production
   until this is in place.
   Same conventions as Modcraft: one static file, no build step, supabase-js
   v2, Google OAuth (PKCE). The publishable key is public by design — RLS is
   what protects the data, exactly as in index.html.
   ========================================================================== */
var SUPA_URL='https://nkpekroogqsmfilypowd.supabase.co';
var SUPA_ANON_KEY='sb_publishable_jpp6ZiFup3v0VVRJtjCOTQ_bF-SEpt4';

/* ---------------------------------------------------------------------------
   Never fail into a blank page. A white screen is indistinguishable from "the
   app is broken" and tells the person nothing they can act on. Anything that
   goes wrong before or during boot gets explained on screen instead.
   --------------------------------------------------------------------------- */
function fatalCard(title, body, showReload){
  var v=document.getElementById('view');
  if(!v)return;
  v.innerHTML='<div class="card"><h3>'+title+'</h3>'+body+
    (showReload?'<button class="primary" data-act="reload">Reload</button>':'')+'</div>';
}
window.addEventListener('error',function(e){
  var v=document.getElementById('view');
  if(v&&(!v.innerHTML.trim()||v.innerText.indexOf('Loading')>=0||v.innerText.indexOf('Sign in to continue')>=0)){
    fatalCard('Something went wrong while loading',
      '<p class="sub">The app hit an unexpected error. The details below help diagnose it.</p>'+
      '<pre class="prev">'+String((e&&e.message)||e)+'</pre>', true);
  }
});

/* This app must be served from a real http(s) address. Google sign-in has to
   redirect back to the page afterwards, and it cannot redirect to a local file
   or to a sandboxed preview — the sign-in appears to work and you land on
   nothing. Detect that up front and say so, rather than letting it happen. */
var PROTO=location.protocol;
var HOSTED=(PROTO==='http:'||PROTO==='https:')&&location.hostname!=='';
if(!HOSTED){
  fatalCard('This app needs to be hosted before you can sign in',
    '<p class="sub">It is open from <code>'+String(PROTO)+'</code>, which has no web address. '+
    'Google sign-in must send you back to the page after you authenticate, and it cannot send you '+
    'back to a file path or a preview window &mdash; so you end up on a blank screen.</p>'+
    '<p class="sub"><b>Two ways to fix it:</b></p>'+
    '<p class="sub">1. <b>Publish it</b> &mdash; put <code>index.html</code> in its own GitHub repo '+
    'and turn on GitHub Pages, the same way Modcraft is published. This is the real answer.</p>'+
    '<p class="sub">2. <b>Try it locally first</b> &mdash; open a terminal in the folder holding '+
    'this file and run <code>python -m http.server 8000</code>, then visit '+
    '<code>http://localhost:8000</code>.</p>'+
    '<p class="sub">Either way, add that address to Supabase &rarr; Authentication &rarr; '+
    'URL Configuration &rarr; <b>Redirect URLs</b>, or sign-in will bounce you back to Modcraft.</p>',
    false);
  throw new Error('not hosted');
}

if(!window.supabase||!window.supabase.createClient){
  fatalCard('Could not load the database library',
    '<p class="sub">The app needs <code>@supabase/supabase-js</code> from jsdelivr.net and the '+
    'browser could not reach it. That is a network or firewall problem, not your data.</p>', true);
  throw new Error('supabase-js failed to load');
}

var supa=window.supabase.createClient(SUPA_URL,SUPA_ANON_KEY,{
  auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'pkce'}});

var ME={email:null,name:null,role:null,company:null,caps:{}};
var TAB='dash'; var _landed=false;   // Rommel 2026-09-27: open on the dashboard
var CACHE={};

/* ---------- small helpers ---------- */
function el(id){return document.getElementById(id)}
/* A page loads its data, then writes itself into #view. If the person clicked another tab while it was
   still loading, a slow page used to finish afterwards and overwrite the tab they picked — the tabs looked
   broken (Rommel, 2026-09-30). Each draw gets a ticket; a page whose ticket is no longer current writes
   into a throwaway box instead of the screen. */
function VIEW(seq){ return (seq===undefined||seq===render._seq)?el('view'):document.createElement('div'); }
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(n){if(n==null||n==='')return '—';
  return '\u20b1'+Number(n).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2})}
function num(n){if(n==null||n==='')return '—';return Number(n).toLocaleString('en-PH')}
function dt(s){if(!s)return '—';var d=new Date(s);
  return d.toLocaleDateString('en-PH',{year:'numeric',month:'short',day:'numeric'})}
function toast(msg,kind){var t=el('toast');t.textContent=msg;t.className=kind||'';
  t.style.display='block';clearTimeout(toast._t);
  toast._t=setTimeout(function(){t.style.display='none'},kind==='err'?9000:4200)}
function errMsg(e){
  var m=(e&&(e.message||e.error_description||e.details))||String(e);
  return m.replace(/^.*?ERROR:\s*[A-Z0-9]+:\s*/,'');
}
function closeModal(){el('modal').classList.remove('on');el('modalBox').innerHTML='';el('modalBox').style.cssText=''}
function openModal(html){el('modalBox').style.cssText='';el('modalBox').innerHTML=html;el('modal').classList.add('on')}
// Close on the backdrop only when the press STARTED on the backdrop. Selecting text in a field and
// releasing outside the window used to count as a backdrop click and throw the form away.
var _modalDownOnBackdrop=false;
el('modal').addEventListener('mousedown',function(e){_modalDownOnBackdrop=(e.target===el('modal'))});
el('modal').addEventListener('click',function(e){
  if(e.target===el('modal')&&_modalDownOnBackdrop)closeModal(); _modalDownOnBackdrop=false});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&el('modal').classList.contains('on'))closeModal()});

/* Every interactive control is declared with data- attributes and dispatched
   here. Handlers are NEVER built by string concatenation: an apostrophe in a
   supplier name or quotation serial would otherwise break out of the attribute
   and execute — the browser HTML-decodes the attribute before the JS parser
   sees it, so escaping alone does not save you. This codebase has been bitten
   by exactly that bug before. */
var ACTIONS={
  go:function(d){go(d.tab)},
  goGroup:function(d){goGroup(d.g)},
  mrFillAll:function(d){mrFillAll(d.id)},
  mrProcessInline:function(d){mrProcessInline(d.id)},
  genPR:function(d){genPR(d.serial)},
  openGate:function(d){openGate(d.serial)},
  viewQuote:function(d){viewQuote(d.serial)},
  printQuote:function(){var f=el('qvFrame');if(f&&f.contentWindow){f.contentWindow.focus();f.contentWindow.print()}},
  recordPay:function(d){recordPay(d.gate)},
  vouch:function(d){vouch(d.gate)},
  vouchProof:function(d){viewVouchProof(d.path)},
  toggleTest:function(){ksToggleTest()},
  clearDates:function(){QF.from='';QF.to='';drawQueuePage(QROWS)},
  buildMR:function(d){buildMR(d.gate)},

/* ---------- auth ---------- */
async function refreshUser(){
  try{ await _refreshUser() }
  catch(e){
    fatalCard('Could not finish signing you in',
      '<p class="sub">You authenticated with Google, but the app could not load your profile.</p>'+
      '<pre class="prev">'+esc(errMsg(e))+'</pre>'+
      '<p class="sub">If this says something about a redirect or an invalid URL, add this page’s '+
      'address to Supabase &rarr; Authentication &rarr; URL Configuration &rarr; Redirect URLs.</p>', true);
  }
}
async function _refreshUser(){
  // Google can hand back an error in the URL — surface it instead of hanging.
  var qp=new URLSearchParams(location.search.replace(/^\?/,''));
  var hp=new URLSearchParams(location.hash.replace(/^#/,''));
  var oauthErr=qp.get('error_description')||qp.get('error')||hp.get('error_description')||hp.get('error');
  if(oauthErr){
    fatalCard('Google sign-in was refused',
      '<pre class="prev">'+esc(oauthErr)+'</pre>'+
      '<p class="sub">Most often this means this page’s address is not listed in Supabase &rarr; '+
      'Authentication &rarr; URL Configuration &rarr; Redirect URLs.</p>', true);
    return;
  }
  var s=await supa.auth.getSession();
  var u=s.data.session&&s.data.session.user;
  if(!u){ME.email=null;render();return}
  ME.email=(u.email||'').trim().toLowerCase();
  // KEYSTONE has its own user list (keystone_users), managed in the Command Center —
  // separate from Modcraft's users. keystone_me() returns this person's row if active.
  var pr=await supa.rpc('keystone_me');
  if(pr.data){ME.name=pr.data.name;ME.role=pr.data.role;ME.company=pr.data.company}
  else{
    // Signed in with Google, but this address is not an active KEYSTONE user. Without a
    // role and company, RLS correctly returns nothing — which would otherwise
    // look like an empty, broken app.
    el('who').innerHTML='<b>'+esc(ME.email)+'</b><br>not a KEYSTONE user';
    el('authBtn').textContent='Sign out';
    drawTabs();
    fatalCard('Your account is not set up in KEYSTONE',
      '<p class="sub">You signed in as <b>'+esc(ME.email)+'</b>, but that address is not an active '+
      'KEYSTONE user, so there is nothing this app is allowed to show you.</p>'+
      '<p class="sub">Ask an Admin to add you in the Command Center &rarr; KEYSTONE users, then sign in '+
      'again. Your KEYSTONE role and company are set there, separately from Modcraft.</p>', false);
    return;
  }
  var cp=await supa.from('adm_user_caps').select('*').eq('email',ME.email).maybeSingle();
  ME.caps=cp.data||{};
  var bm=await supa.from('adm_settings').select('value').eq('key','BUILD').maybeSingle();
  ME.build=!!(bm.data&&bm.data.value&&bm.data.value.on);
  // Admin tier gets the operational capabilities, but NOT the approver roles.
  // Rommel and Kathleen are both Admin tier; if being an Admin granted the
  // Managing Director role, Rommel could approve his own big order alone and
  // that control would be meaningless. Approver roles come only from the caps row.
  if(ME.role==='Admin'||ME.role==='Director'){
    ME.caps=Object.assign({},ME.caps,
      {can_request:1,can_approve:1,can_vouch:1,can_release:1,can_source:1,can_issue:1,adminTier:1});
  }
  el('who').innerHTML='<b>'+esc(ME.name||ME.email)+'</b><br>'+
    esc(ME.role||'no role')+(ME.company?' · '+esc(ME.company):'');
  el('authBtn').textContent='Sign out';
  if(!_landed){ _landed=true;
    var c=ME.caps||{};
    TAB=(c.can_issue&&!c.adminTier)?'mr':(c.is_manager_approver||c.is_hpo_approver||c.is_md_approver)&&!c.adminTier?'appr':'dash';
    LAST[groupOf(TAB).k]=TAB; }
  render();
}

  if(ME.email){await supa.auth.signOut();location.reload();return}
  await supa.auth.signInWithOAuth({provider:'google',

/* ---------- RPC with preview-first confirmation ----------
   Every mutating action goes through here: it first calls the function with
   confirm=false, shows exactly what would change, and only calls again with
   confirm=true once the person agrees. Nothing destructive happens unasked. */
async function rpcPreview(fn,args,title,onDone){
  var p=await supa.rpc(fn,Object.assign({},args,{p_confirm:false}));
  if(p.error){toast(errMsg(p.error),'err');return}
  if(p.data&&p.data.error_message){toast(p.data.error_message,'err');return}
  openModal(
    '<h3>'+esc(title)+'</h3>'+
    '<p class="sub">Review what this will do. Nothing has been saved yet.</p>'+
    // Release: say plainly which Modcraft Job Order becomes the PMES job, or why none does.
    (p.data&&p.data.job_order?'<div style="border:1px solid #0f766e;background:#ecfdf5;color:#065f46;border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:13px">'+
      'Releases Modcraft Job Order <b>'+esc(p.data.job_order.jo_number)+'</b>'+(p.data.job_order.option?' ('+esc(p.data.job_order.option)+')':'')+
      ' — '+esc(p.data.job_order.pieces)+' pieces, '+esc(p.data.job_order.boards)+' boards. It becomes the PMES job code, matching the printed labels.</div>':'')+
    (p.data&&p.data.job_order_note?'<div style="border:1px solid #b45309;background:#fff7ed;color:#7c2d12;border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:13px">⚠ '+esc(p.data.job_order_note)+'</div>':'')+
    previewSummary(fn,p.data)+
    '<div class="row right" style="margin-top:14px">'+
      '<button class="ghost" data-act="closeModal">Cancel</button>'+
      '<button class="primary" id="goBtn">Confirm</button></div>');
  el('goBtn').onclick=async function(){
    this.disabled=true;this.textContent='Working…';
    var r=await supa.rpc(fn,Object.assign({},args,{p_confirm:true}));
    closeModal();
    if(r.error){toast(errMsg(r.error),'err');return}
    if(r.data&&r.data.error_message){toast(r.data.error_message,'err');return}
    toast('Done.','ok');
    CACHE={cfg:CACHE.cfg,chain:CACHE.chain}; _needAt=0;
    if(onDone)onDone(r.data); else render();
  };
}

/* What a review window says in words (the raw reply is no longer shown — Rommel, 2026-10-18). */
function _pvRow(k,v){return '<tr><td class="mini" style="padding:3px 10px 3px 0;white-space:nowrap">'+esc(k)+'</td><td><b>'+v+'</b></td></tr>'}
function previewSummary(fn,d){
  d=d||{}; var h='';
  if(fn==='adm_build_material_requests'){
    var items=d.items||[];
    h+='<p>This prepares the material request for <b>'+esc(d.quotation_serial||'')+'</b> from the quotation’s own scope: '+
       '<b>'+num(d.warehouse_lines||0)+'</b> line(s) to take from the warehouse'+
       (d.purchase_lines?' and <b>'+num(d.purchase_lines)+'</b> to purchase (outsourced / made to order)':'')+'. '+
       'It stays a draft until the job is unlocked.</p>';
    if(items.length) h+='<table style="width:100%"><thead><tr><th>Item</th><th class="num">Qty</th><th>Unit</th><th>From</th></tr></thead><tbody>'+
      items.map(function(i){return '<tr><td>'+esc(i.item)+(i.area?'<div class="mini">'+esc(i.area)+'</div>':'')+'</td>'+
        '<td class="num">'+num(i.qty)+'</td><td>'+esc(i.unit||'')+'</td><td>'+esc(i.stream)+'</td></tr>'}).join('')+'</tbody></table>';
    else h+='<div class="warn">The quotation has no materials or hardware to request.</div>';
    return h;
  }
  if(fn==='adm_release_gate'){
    var paid=Number(d.verified_paid||0), need=Number(d.required_amount||0);
    h+='<table>'+
      _pvRow('Quotation',esc(d.quotation_serial||''))+
      _pvRow('Made by (destination)',esc(d.destination_company||'—'))+
      _pvRow('Payment',money(paid)+' received of '+money(need)+' required'+(d.gate_status==='vouched'?' (vouched)':''))+
      _pvRow('Terms',esc(d.payment_terms||'—'))+
      _pvRow('Materials',num(d.material_request_lines||0)+' line(s) — '+(d.material_sourcing==='mto'?'some made to order':'from stock / purchase')+
        (d.will_authorize_warehouse_mrs?' · warehouse request authorized':'')+(d.will_authorize_purchase_mrs?' · purchase request authorized':''))+
      _pvRow('Production',d.will_create_job?('New PMES job'+(d.will_create_pmes_parts?' with '+num(d.will_create_pmes_parts)+' labelled parts':'')):
        ('Updates existing PMES job '+esc((d.pmes_job||{}).job_code||'')))+
      (d.segregation_override?_pvRow('Override','You opened this gate yourself — recorded as an override with your reason'):'')+
      '</table>';
    return h;
  }
  // Anything else: the plain fields, in words, skipping internals.
  var skip={preview:1,note:1,action:1};
  var rows=Object.keys(d).filter(function(k){return !skip[k]&&(d[k]==null||typeof d[k]!=='object')})
    .map(function(k){return _pvRow(k.replace(/_/g,' ').replace(/^./,function(c){return c.toUpperCase()}),
      esc(typeof d[k]==='number'?num(d[k]):(d[k]==null?'—':String(d[k]))))});
  return rows.length?'<table>'+rows.join('')+'</table>':'';
}

/* ================= TABS =================
   Rommel 2026-09-27: tabs in work order, grouped. A main tab may hold sub-tabs; TAB is always the
   leaf (the screen shown). Each main tab shows a count of what waits for the signed-in person. */
var GROUPS=[
  {k:'dash',  t:'Dashboard',     i:'ti-chart-bar',     leaves:[['dash','Dashboard']]},
  {k:'queue', t:'Payment & Release', i:'ti-lock-open',     leaves:[['queue','Payment & Release']]},
  {k:'purch', t:'Purchasing',    i:'ti-file-dollar',   leaves:[['canv','Canvassing'],['review','My requests'],['appr','Approvals'],['po','Ready for Odoo'],['src','Suppliers']]},
  {k:'wh',    t:'Warehouse',     i:'ti-package',       leaves:[['mr','Material requests'],['boards','Extra board requests']]},
  // Rommel 2026-09-28: read-only view of HATID (logistics). Signing stays in HATID.
  {k:'logi',  t:'Logistics',     i:'ti-truck-delivery',leaves:[['lg_live','Today'],['lg_pickup','Pick-ups'],['lg_sched','Delivery schedules'],['lg_map','Map'],['lg_msgs','Client messages']]},
  {k:'more',  t:'More',          i:'ti-dots',          leaves:[['prov','Plant & HRIS'],['kset','Settings']]}
];
var LAST={};
function groupOf(leaf){for(var i=0;i<GROUPS.length;i++){if(GROUPS[i].leaves.some(function(l){return l[0]===leaf}))return GROUPS[i]}return GROUPS[0]}
function _badge(n){return n?' <span class="tabcount">'+n+'</span>':''}
function leafOk(l){return !(l[0]==='lg_msgs'&&LG.me&&!LG.me.messages)&&!(l[0]==='kset'&&!(ME.caps&&ME.caps.adminTier))}
function drawTabs(){
  var g=groupOf(TAB);
  el('tabs').innerHTML=GROUPS.map(function(G){
    var n=G.leaves.reduce(function(a,l){return a+(NEED[l[0]]||0)},0);
    return '<button class="'+(g.k===G.k?'on':'')+'" data-act="goGroup" data-g="'+esc(G.k)+'">'+
      '<i class="ti '+G.i+'"></i> '+esc(G.t)+_badge(n)+'</button>'}).join('');
  var st=el('subtabs'); if(!st)return;
  st.innerHTML=g.leaves.length>1?g.leaves.filter(leafOk).map(function(l){
    return '<button class="'+(TAB===l[0]?'on':'')+'" data-act="go" data-tab="'+esc(l[0])+'">'+esc(l[1])+_badge(NEED[l[0]]||0)+'</button>'}).join(''):'';
  st.style.display=g.leaves.length>1?'':'none';
}
function go(k){TAB=k;LAST[groupOf(k).k]=k;drawTabs();render()}
function goGroup(gk){var G=GROUPS.filter(function(x){return x.k===gk})[0]||GROUPS[0];go(LAST[gk]||G.leaves[0][0])}

/* What waits for the signed-in person — drives the tab counts and the Dashboard "Needs you" row.
   Counts only what this person can act on; refreshed every 20 s at most, and after every action. */
var NEED={}, NEED_DETAIL={}, _needAt=0, _needBusy=null;
async function refreshNeeds(force){
  if(!ME.email||!ME.role) return;
  if(!force&&Date.now()-_needAt<20000) return;
  if(_needBusy) return _needBusy;
  _needBusy=(async function(){
    var c=ME.caps||{}, canAct=c.can_release||c.can_approve, canOpen=c.can_source||c.can_approve;
    var q=await Promise.all([
      supa.from('adm_v_release_queue').select('serial,fq_client_approved,gate_id,gate_status').limit(1000),
      supa.from('adm_purchase_requests').select('id,status,requested_by,signed_by,quotation_serial').limit(1000),
      Promise.resolve({data:[]}),   // purchase orders are made in Odoo now
      supa.from('adm_material_requests').select('id,status').in('status',['authorized','partially_issued']).limit(1000),
      supa.from('pmes_board_requests').select('id,status').in('status',['sent_to_keystone','escalated']).limit(500),
      supa.from('adm_canvass').select('id,status,started_by,submitted_by,quotation_serial').in('status',['open','for_hpo','approved']).limit(1000)
    ]);
    var cvs=((q[5]&&q[5].data)||[]).filter(function(r){return !isTestSerial(r.quotation_serial)});
    var gq=(q[0].data||[]).filter(function(r){return !isTestSerial(r.serial)}), prs=(q[1].data||[]).filter(function(r){return !isTestSerial(r.quotation_serial)}), pos=q[2].data||[], mrs=q[3].data||[], brs=q[4].data||[];
    var fq=gq.filter(function(r){return r.fq_client_approved});
    var mine=function(r){return ((r.requested_by||'').toLowerCase()===ME.email)||((r.signed_by||'').toLowerCase()===ME.email)};
    var d={
      gates_to_open: canOpen?fq.filter(function(r){return !r.gate_id}).length:0,
      awaiting_payment: canAct?fq.filter(function(r){return r.gate_status==='pending_payment'}).length:0,
      ready_to_release: c.can_release?fq.filter(function(r){return r.gate_status==='paid'||r.gate_status==='vouched'}).length:0,
      my_drafts: prs.filter(function(r){return r.status==='draft'&&(r.requested_by||'').toLowerCase()===ME.email}).length,
      pr_to_approve: prs.filter(function(r){return !mine(r)&&((r.status==='pending_manager'&&c.is_manager_approver)||(r.status==='pending_hpo'&&c.is_hpo_approver))}).length,
      po_to_approve: 0,
      po_to_act: c.can_source?prs.filter(function(r){return r.status==='approved'}).length:0,
      mr_to_process: c.can_issue?mrs.length:0,
      boards_to_decide: brs.filter(function(r){return (r.status==='sent_to_keystone'&&(c.can_issue||c.can_release))||(r.status==='escalated'&&c.is_plant_head)}).length,
      // Canvassing: what this person can move — finish their open canvass, approve as Head of Plant Ops, or turn an approved one into a request.
      canv_to_act: cvs.filter(function(r){return (r.status==='for_hpo'&&c.is_hpo_approver&&(r.submitted_by||'').toLowerCase()!==ME.email)||
        ((r.status==='open'||r.status==='approved')&&(c.can_source||c.can_request)&&(r.started_by||'').toLowerCase()===ME.email)}).length
    };
    NEED_DETAIL=d;
    NEED={canv:d.canv_to_act, queue:d.gates_to_open+d.ready_to_release, review:d.my_drafts, appr:d.pr_to_approve+d.po_to_approve,
          po:d.po_to_act, mr:d.mr_to_process, boards:d.boards_to_decide};
    lgNeedCounts();
    _needAt=Date.now(); _needBusy=null; drawTabs();
    // Logistics comes from HATID — fetched on its own so a slow HATID never holds up the rest.
    lgLoad(false).then(function(){lgNeedCounts();drawTabs();pkPoll()}).catch(function(){});
  })().catch(function(){_needBusy=null});
  return _needBusy;
}

async function viewQueue(){
  var _vs=render._seq;   // this page's ticket — see VIEW()
  // The list seen last time shows at once; the fresh one replaces it when it arrives (only if it changed).
  if(QCACHE) drawQueuePage(QCACHE,_vs);
  else VIEW(_vs).innerHTML='<div class="empty">Loading approved quotations…</div>';
  // Only approved quotations, and no cut-off: this used to fetch the top 300 by value and drop the
  // unapproved ones afterwards, so with more than 300 quotations an approved job with a small total
  // could silently fall off the list.
  var q=await supa.from('adm_v_release_queue').select('*')
    .eq('fq_client_approved',true)
    .order('total',{ascending:false}).limit(2000);
  if(q.error){
    if(QCACHE){ toast('Could not refresh Payment & Release: '+errMsg(q.error)); return; }
    VIEW(_vs).innerHTML='<div class="card"><div class="warn">'+esc(errMsg(q.error))+'</div></div>'; return;
  }
  var fresh=(q.data||[]).filter(function(r){return r.fq_client_approved});
  // Advance canvassing (Rommel, 2026-10-18): purchasing may SEE the outsource items of a quotation the
  // client has not final-approved yet, to ask suppliers early. No payment, gate or purchase request.
  var iqq=await supa.rpc('adm_fq_waiting_list');   // Final Quotations waiting for the client, with their locked date
  var iqFresh=(iqq.data||[]).filter(function(r){return !isTestSerial(r.serial)||(KS_SHOW_TEST&&ksCanSeeTest())});
  CANV_ROWS=iqFresh;
  // Canvass per quotation (Rommel, 2026-10-23): the waiting list shows Start canvassing / Open canvass.
  var cvq=await supa.from('adm_canvass').select('id,cv_no,status,quotation_serial').neq('status','cancelled').limit(2000);
  CV_BY_SERIAL={}; (cvq.data||[]).forEach(function(c){CV_BY_SERIAL[c.quotation_serial]=c});
  KS_TEST_N=fresh.filter(function(r){return isTestSerial(r.serial)}).length;
  if(!(KS_SHOW_TEST&&ksCanSeeTest())) fresh=fresh.filter(function(r){return !isTestSerial(r.serial)});
  var sig=JSON.stringify(fresh)+'|'+JSON.stringify(iqFresh)+'|'+JSON.stringify(CV_BY_SERIAL);
  if(QCACHE&&sig===QCACHE_SIG) return;          // nothing changed since the cached draw
  QCACHE=fresh; QCACHE_SIG=sig;
  drawQueuePage(fresh,_vs);
}

/* Release Queue search + filters. Kept across re-renders so an action never loses the person's place. */
var QROWS=[], QF={q:'',co:'',st:'',tab:'approved',from:'',to:''};
function qfTab(t){ QF.tab=t; drawQueuePage(QROWS); }
// Released jobs split by how they were released (Rommel, 2026-10-18): on a vouch, fully paid, or with
// a balance still owed. Everything client-approved and not yet released is "approved".
function qfTabOf(r){
  if(r.gate_status!=='released') return 'approved';
  if(r.vouched_by) return 'vouched';
  return (+r.balance||0)>0.005?'balance':'paid';
}
var QF_TABS=[['waiting','Waiting for client approval'],['approved','Approved — not released'],
  ['paid','Released — fully paid'],['balance','Released — with balance'],['vouched','Released — vouched'],['all','All']];
// The date a row is filtered by, per tab: final-locked (waiting), released (released tabs), client approved (others).
function qfDateOf(r,tab){
  var d=tab==='waiting'?r.final_locked_at:(tab==='paid'||tab==='balance'||tab==='vouched')?r.released_at:r.client_approved_at;
  return d?String(d).slice(0,10):'';
}
function qfInDates(r,tab){
  if(!QF.from&&!QF.to) return true;
  var d=qfDateOf(r,tab); if(!d) return false;
  return (!QF.from||d>=QF.from)&&(!QF.to||d<=QF.to);
}
function qfDateLabel(tab){ return tab==='waiting'?'Final locked':(tab==='paid'||tab==='balance'||tab==='vouched')?'Released':'Client approved'; }
function qfSetDate(which,v){ QF[which]=v||''; drawQueuePage(QROWS); }
function _coKey(s){s=String(s||'').toLowerCase();
  return s.indexOf('module')>=0?'M':s.indexOf('cebu')>=0?'C':s.indexOf('world class')>=0?'W':''}
function drawQueueList(){
  var box=el('qfList'); if(!box)return;
  var words=QF.q.toLowerCase().split(/\s+/).filter(Boolean);
  var list=QROWS.filter(function(r){
    if(!r.fq_client_approved) return false;
    if(QF.tab!=='all'&&qfTabOf(r)!==QF.tab) return false;
    if(!qfInDates(r,QF.tab)) return false;
    if(QF.co&&_coKey(r.company)!==QF.co) return false;
    if(QF.st){
      var st=r.gate_id?r.gate_status:'nogate';
      if(QF.st==='cleared'?(st!=='paid'&&st!=='vouched'):st!==QF.st) return false;
    }
    var hay=[r.serial,r.client_name,r.project_name,r.prepared_by,r.agent,r.company,r.destination_company,r.jo_number,r.pmes_job_code]
      .join(' ').toLowerCase();
    return words.every(function(w){return hay.indexOf(w)>=0});
  });
  loadOutsCounts(list.filter(function(r){return !r.pr_no}).map(function(r){return r.serial}));
  box.innerHTML=(list.length?list.map(gateCard).join(''):
    '<div class="empty">'+(QROWS.some(function(r){return r.fq_client_approved&&(QF.tab==='all'||qfTabOf(r)===QF.tab)})?'Nothing matches the search.':'Nothing here yet.')+'</div>')+
    '<div class="mini" style="margin-top:6px">'+list.length+' shown</div>';
}

async function loadOutsCounts(serials){

/* The quotation as the client received it, for reference. Modcraft saves every printout (HTML)
   in Storage under the quotation's folder at each lock/send; show the newest Final Quotation by
   default, with the others (drafts, options) selectable. Shown sandboxed — no scripts run. */
function _qvLabel(name){
  var f=name.split('/').pop(), m=f.match(/^(\S+) - .* - (.+)\.html$/);
  return m?m[2]+' — '+m[1]:f;
}
// Every quotation opened in KEYSTONE is marked as an admin reference copy — on screen and on every
// printed page — so it can never be passed on as the client's quotation (Rommel, 2026-10-18).
function _adminCopyMark(html,serial){
  var stamp='<style>@media print{.kq-mark{position:fixed}}</style>'+
    '<div class="kq-mark" style="position:fixed;left:0;right:0;top:42%;text-align:center;transform:rotate(-24deg);font:800 64px Arial,sans-serif;'+
      'color:rgba(185,28,28,.14);pointer-events:none;z-index:9999;white-space:nowrap">ADMIN COPY ONLY · REFERENCE ONLY</div>'+
    '<div style="border:2px solid #b91c1c;background:#fef2f2;color:#b91c1c;font:700 12px Arial,sans-serif;padding:6px 10px;margin:0 0 10px;text-align:center;letter-spacing:.04em">'+
      'ADMIN COPY ONLY — REFERENCE ONLY · '+String(serial||'').replace(/[<>&]/g,'')+' · not for the client · printed from KEYSTONE</div>';
  var i=String(html).search(/<body[^>]*>/i);
  if(i<0) return stamp+html;
  var j=html.indexOf('>',i)+1;
  return html.slice(0,j)+stamp+html.slice(j);
}
async function viewQuote(serial){
  var folder=String(serial||'').replace(/[^A-Za-z0-9 ._\-\/]/g,'-');
  var box=el('modalBox');
  openModal('<h3>Quotation '+esc(serial)+'</h3><div class="empty">Loading…</div>');
  box.style.cssText='max-width:1100px;width:96vw';
  var l=await supa.storage.from('quotations').list(folder,{limit:200,sortBy:{column:'updated_at',order:'desc'}});
  if(l.error){box.innerHTML='<h3>Quotation '+esc(serial)+'</h3><div class="warn">'+esc(errMsg(l.error))+'</div>';return}
  var files=(l.data||[]).filter(function(f){return /\.html$/i.test(f.name)&&!/ - BOM\.html$/i.test(f.name)});
  if(!files.length){box.innerHTML='<h3>Quotation '+esc(serial)+'</h3>'+
    '<div class="empty">No saved Final Quotation for this quotation yet. Opening it in Modcraft on the Final Quotation tab saves one automatically.</div>'+
    '<div class="row right" style="margin-top:12px"><button class="ghost" data-act="closeModal">Close</button></div>';return}
  var rank=function(n){return /Final Quotation\.html$/i.test(n)?0:/Final Draft\.html$/i.test(n)?1:/Draft\.html$/i.test(n)?2:3};
  files.sort(function(a,b){return rank(a.name)-rank(b.name)||String(b.updated_at).localeCompare(String(a.updated_at))});
  box.innerHTML='<div class="row" style="gap:8px;flex-wrap:wrap"><h3 style="margin:0">Quotation '+esc(serial)+'</h3>'+
    '<div style="flex:1"></div>'+
    '<select id="qvPick" style="width:auto;max-width:460px">'+files.map(function(f,i){
      return '<option value="'+i+'">'+esc(_qvLabel(f.name))+' · saved '+esc(dt(f.updated_at||f.created_at))+'</option>'}).join('')+'</select>'+
    '<button data-act="printQuote"><i class="ti ti-printer"></i> Print / Save PDF</button>'+
    '<button class="ghost" data-act="closeModal">Close</button></div>'+
    '<p class="sub" style="margin:6px 0">Admin copy, reference only — the copy Modcraft saved when it was locked or sent. Read-only; it prints marked “ADMIN COPY ONLY — REFERENCE ONLY”.</p>'+
    '<iframe id="qvFrame" sandbox="allow-same-origin allow-modals" style="width:100%;height:72vh;border:1px solid var(--line);border-radius:8px;background:#fff"></iframe>';
  async function show(i){
    var d=await supa.storage.from('quotations').download(folder+'/'+files[i].name);
    if(d.error||!d.data){el('qvFrame').srcdoc='<p style="font-family:sans-serif">Could not open this file: '+esc(errMsg(d.error||'missing'))+'</p>';return}
    el('qvFrame').srcdoc=_adminCopyMark(await d.data.text(),serial);
  }
  el('qvPick').onchange=function(){show(+this.value)};
  show(0);
}

        'MSSI builds MSSI and WCL jobs; CWLI builds Cebu jobs. Change it only when another plant builds this one.</div></div>'+
      '<div><label>Payment option</label><select id="gOpt">'+

        '</select></div>'+
    '</div>'+
    '<div id="gTermsBox">'+
      '<div class="grid g2"><div><label>Required to unlock (%)</label><input id="gPct" type="number" min="1" max="100" value="'+(Number(cfg.defaultRequiredPct)||50)+'"></div><div></div></div>'+
      '<label>Agreed terms</label><select id="gTerms">'+
        terms.map(function(t){return '<option>'+esc(t)+'</option>'}).join('')+'</select>'+
      '<input id="gTermsTxt" style="margin-top:6px" value="'+esc(terms[0])+'">'+
      '<div class="mini">The % required to unlock follows the terms you pick (the first % in them); you can still change it.</div>'+
      // World Class Laminate jobs on payment terms carry their Odoo sales order number (Rommel, 2026-10-18).
      '<div id="gSoBox" style="display:none"><label>Odoo SO number (required for WCL on payment terms)</label>'+
        '<input id="gSo" placeholder="e.g. S79400"></div>'+
    '</div>'+
    '<div id="gVouchBox" style="display:none">'+
      '<div class="warn">Vouching unlocks production <b>without payment</b>. It is recorded with the name of who vouched, the proof, and your name as the one who recorded it.</div>'+
      vouchFieldsHtml()+
    '</div>'+
    '<div class="row right" style="margin-top:14px">'+
      '<button class="ghost" data-act="closeModal">Cancel</button>'+
      '<button class="primary" id="okGate">Open gate</button></div>');
  // Default the plant to the quotation's own company, and keep the % in step with the terms, so the
  // gate can never say "100% upon approval" while requiring 50%.
  // Rommel 2026-09-27: MSSI builds for both MSSI and WCL quotations; Cebu builds its own.
  el('gCo').value=_coKey(r.company)==='C'?'CWLI':'MSSI';
  function syncPct(){var m=String(el('gTermsTxt').value).match(/(\d+(?:\.\d+)?)\s*%/);
    el('gPct').value=m?m[1]:(Number(cfg.defaultRequiredPct)||50);}
  el('gTerms').onchange=function(){el('gTermsTxt').value=this.value;syncPct()};
  el('gTermsTxt').oninput=syncPct; syncPct();
  var isWcl=_coKey(r.company)==='W';
  function syncSo(){ el('gSoBox').style.display=(isWcl&&/payment terms/i.test(el('gOpt').value))?'':'none'; }
  el('gOpt').addEventListener('change',syncSo); syncSo();
  el('gOpt').onchange=function(){

    el('gTermsBox').style.display=v?'none':''; el('gVouchBox').style.display=v?'':'none';
    el('okGate').textContent=v?'Open gate and vouch':'Open gate';

    var soNeeded=!isV&&isWcl&&/payment terms/i.test(el('gOpt').value), so=el('gSo').value.trim();
    if(soNeeded&&!so){ toast('Enter the Odoo SO number for this WCL job.','err'); el('gSo').focus(); return; }

      quotation_total:r.total, amount_due:parseFloat(el('gAmt').value)||0,
      payment_option:isV?'Vouch':el('gOpt').value, odoo_so:soNeeded?so:null,
      payment_terms:isV?'Vouched by '+vf.name:el('gTermsTxt').value,
      required_pct:isV?100:(parseFloat(el('gPct').value)||100),
      source_quotation_status:r.status, created_by:ME.email}).select('id').single();
    closeModal();
    if(ins.error){toast(errMsg(ins.error),'err');return}
    if(!isV){ toast('Gate opened.','ok'); render(); return; }
    applyVouch(ins.data.id,vf,true);
  };
}

// The payment options, same list on the gate and on Record payment (Rommel, 2026-10-18).
function payOptions(){
  var cfg=(CACHE.cfg&&CACHE.cfg.value)||{};
  var o=((cfg.paymentOptions)||['Bank transfer','Cheque','Cash','Online']).filter(function(x){return !/vouch/i.test(x)});
  if(!o.some(function(x){return /payment terms/i.test(x)})) o.push('With payment terms');
  return o;
}

/* A vouch records WHO vouched (by name) and proof that they did — e.g. a screenshot of their message
   or a signed note (Rommel, 2026-10-18). The proof goes to the private keystone-vouch bucket under the
   gate's own folder; adm_vouch_gate refuses without both. */
function vouchFieldsHtml(){
  return '<label>Vouched by (name of the person who vouched)</label><input id="vN" placeholder="e.g. the director who approved it">'+
    '<label>Reason (required)</label><textarea id="vR" rows="2"></textarea>'+
    '<label>Proof that they vouched (required)</label><input id="vP" type="file" accept="image/*,application/pdf">'+
    '<div class="mini">A screenshot of their message, an email, or a signed note. Image or PDF, up to 10 MB.</div>'+
    '<label>Vouch expires (optional)</label><input id="vE" type="date">';
}
function readVouchFields(){
  var name=el('vN').value.trim(), reason=el('vR').value.trim(), f=el('vP').files&&el('vP').files[0];
  if(!name){toast('Enter the name of the person who vouched.','err');return null}
  if(!reason){toast('A reason is required to vouch.','err');return null}
  if(!f){toast('Attach proof that it was vouched.','err');return null}
  if(f.size>10*1024*1024){toast('The proof file is over 10 MB.','err');return null}
  return {name:name,reason:reason,file:f,exp:el('vE').value?new Date(el('vE').value).toISOString():null};
}
async function applyVouch(gid,vf,gateJustOpened){
  var safe=String(vf.file.name).replace(/[^A-Za-z0-9._-]+/g,'_').slice(-80);
  var path=gid+'/'+Date.now()+'_'+safe;
  var up=await supa.storage.from('keystone-vouch').upload(path,vf.file,{upsert:false,contentType:vf.file.type||undefined});
  if(up.error){
    toast((gateJustOpened?'Gate opened, but the proof could not be uploaded — press Vouch on the card to try again. ':'Proof could not be uploaded: ')+errMsg(up.error),'err');
    if(gateJustOpened) render();
    return;
  }
  rpcPreview('adm_vouch_gate',{p_gate_id:gid,p_reason:vf.reason,p_vouch_name:vf.name,p_proof:path,p_expires_at:vf.exp},
    'Vouch — review');
}
async function viewVouchProof(path){
  var r=await supa.storage.from('keystone-vouch').createSignedUrl(path,3600);
  if(r.error){toast(errMsg(r.error),'err');return}
  window.open(r.data.signedUrl,'_blank','noopener');
}
function vouch(gid){
  openModal('<h3>Vouch for this job</h3>'+
    '<div class="warn">Vouching unlocks production <b>without payment</b>. It is recorded with the name of who vouched, the proof, and your name as the one who recorded it.</div>'+
    vouchFieldsHtml()+
    '<div class="row right" style="margin-top:14px">'+
      '<button class="ghost" data-act="closeModal">Cancel</button>'+
      '<button class="primary" id="okV">Continue</button></div>');
  el('okV').onclick=function(){
    var vf=readVouchFields(); if(!vf) return;
    closeModal(); applyVouch(gid,vf,false);
  };
}

async function release(gid){
  var mr=await supa.from('adm_material_requests').select('id',{count:'exact',head:true}).eq('gate_id',gid);

function release2(gid){
  var go_=function(reason){rpcPreview('adm_release_gate',{p_gate_id:gid,p_override_reason:reason||null},'Unlock material request + Job Order — review')};
  // Segregation of duties: whoever opened the gate may not release it, except an Admin/Director with a
  // written reason. Ask only when it applies.
  var r=(QROWS||[]).filter(function(x){return x.gate_id===gid})[0]||{};
  if(RELEASE_PEOPLE!=='one'&&ME.caps.adminTier&&(r.gate_created_by||'').toLowerCase()===ME.email)
    return askText('You opened this gate yourself','Override reason',true,go_,

/* ================= MY REQUESTS (user review & combine) =================
   The outsource materials land here from a LOCKED quotation. Everything the
   user does on this page happens in KEYSTONE only — the quotation is never
   written back to, so the project total cannot move. Once signed, the lines
   are frozen and the approval chain begins.
   ====================================================================== */
async function viewReview(){
  var _vs=render._seq;   // this page's ticket — see VIEW()
  VIEW(_vs).innerHTML='<div class="empty">Loading your requests…</div>';
  var q=await supa.from('adm_purchase_requests').select('*')
    .order('created_at',{ascending:false}).limit(200);
  if(q.error)throw q.error;
  var rows=q.data||[];
  var mine=rows.filter(function(r){return (r.requested_by||'').toLowerCase()===ME.email});
  var drafts=mine.filter(function(r){return r.status==='draft'});

/* ================= PASSCODE, SIGNATURE, PRF =================
   Rommel, 2026-10-18: a purchase request goes requester -> Manager -> Head of Plant Operations, and
   each enters their passcode so their signature goes on the PRF. The passcode is the person's Modcraft
   PIN when they have one (checked by the database, never seen by this page), otherwise a KEYSTONE
   passcode they set here. A wrong passcode is counted; 5 in 15 minutes locks it for a while. */
var CHARGE_LABEL={project:'Project (quotation)',opex:'OPEX',capex:'CAPEX'};
function askPass(title,sub,cb){
  supa.rpc('adm_passcode_status').then(function(r){
    var st=r&&r.data;
    if(st==='none') return myPasscode(function(){askPass(title,sub,cb)});
    openModal('<h3>'+esc(title)+'</h3>'+(sub?'<p class="sub">'+sub+'</p>':'')+
      '<label>'+(st==='modcraft'?'Your Modcraft PIN':'Your KEYSTONE passcode')+'</label>'+
      '<input id="pcIn" type="password" inputmode="numeric" autocomplete="off" maxlength="8" style="max-width:200px;letter-spacing:4px">'+
      '<div class="mini" style="margin-top:4px">It puts your signature on the purchase request form.</div>'+
      '<div class="row right" style="margin-top:14px"><button class="ghost" data-act="closeModal">Cancel</button><button class="primary" id="pcOk">Continue</button></div>');
    setTimeout(function(){var t=el('pcIn');if(t)t.focus()},30);
    var go_=function(){var v=el('pcIn').value.trim(); if(!v){toast('Enter your passcode.','err');return} closeModal(); cb(v);};
    el('pcOk').onclick=go_; el('pcIn').onkeydown=function(e){if(e.key==='Enter')go_()};
  });
}
async function myPasscode(after){
  var r=await supa.rpc('adm_passcode_status'), st=r.data;
  var sig=await mySigImage();
  openModal('<h3>My passcode &amp; signature</h3>'+
    (st==='modcraft'?'<div class="info">You use your <b>Modcraft PIN</b> here. To change it, change it in Modcraft (avatar menu › Set / Change PIN).</div>':
      '<p class="sub">'+(st==='keystone'?'Change your KEYSTONE passcode.':'Set a passcode (4–8 digits). You enter it each time you sign or approve a purchase request.')+'</p>'+
      '<div class="grid g2">'+(st==='keystone'?'<div><label>Current passcode</label><input id="mpC" type="password" inputmode="numeric" maxlength="8"></div>':'')+
      '<div><label>New passcode</label><input id="mpN" type="password" inputmode="numeric" maxlength="8"></div>'+
      '<div><label>Repeat new passcode</label><input id="mpR" type="password" inputmode="numeric" maxlength="8"></div></div>'+
      '<div class="row right" style="margin-top:8px"><button class="primary" id="mpOk">Save passcode</button></div>')+
    '<h4 style="margin:16px 0 6px">My signature</h4>'+
    (sig?'<div style="background:#fff;border-radius:8px;padding:8px;display:inline-block"><img src="'+sig.src+'" style="max-height:60px"></div><div class="mini">'+(sig.from==='modcraft'?'From Modcraft. Change it in Modcraft.':'Uploaded in KEYSTONE.')+'</div>':
      '<div class="warn">No signature on file — the PRF will show your name only.</div>')+
    (!sig||sig.from==='keystone'?'<label>Upload a signature (PNG with a clear background is best)</label><input id="mpS" type="file" accept="image/*">'+
      '<div class="row right" style="margin-top:8px"><button id="mpSOk">Save signature</button></div>':'')+
    '<div class="row right" style="margin-top:14px"><button data-act="closeModal">Close</button></div>');
  if(el('mpOk')) el('mpOk').onclick=async function(){
    var n=el('mpN').value.trim(); if(n!==el('mpR').value.trim()){toast('The two new passcodes do not match.','err');return}
    var x=await supa.rpc('adm_passcode_set',{p_new:n,p_current:el('mpC')?el('mpC').value.trim():null});
    if(x.error){toast(errMsg(x.error),'err');return}
    toast('Passcode saved.','ok'); closeModal(); if(after) after();
  };
  if(el('mpSOk')) el('mpSOk').onclick=async function(){
    var f=el('mpS').files[0]; if(!f){toast('Choose an image.','err');return}
    var url=await shrinkImage(f,600,180);
    var x=await supa.from('adm_signatures').upsert({email:ME.email,image:url,updated_at:new Date().toISOString()});
    if(x.error){toast(errMsg(x.error),'err');return}
    toast('Signature saved.','ok'); myPasscode(after);
  };
}
function shrinkImage(file,maxW,maxH){
  return new Promise(function(ok,no){ var fr=new FileReader(); fr.onload=function(){ var im=new Image(); im.onload=function(){
    var k=Math.min(1,maxW/im.width,maxH/im.height), c=document.createElement('canvas'); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height); ok(c.toDataURL('image/png')); }; im.onerror=no; im.src=fr.result; }; fr.onerror=no; fr.readAsDataURL(file); });
}
async function sigImages(emails){
  emails=emails.filter(Boolean).map(function(e){return e.toLowerCase().trim()});
  var out={}; if(!emails.length) return out;
  var a=await supa.from('settings').select('key,value').in('key',emails.map(function(e){return 'SIG_'+e}));
  (a.data||[]).forEach(function(r){var v=r.value; if(typeof v==='string'&&/^data:image/.test(v)) out[r.key.slice(4).toLowerCase()]={src:v,from:'modcraft'}});
  var b=await supa.from('adm_signatures').select('email,image').in('email',emails);
  (b.data||[]).forEach(function(r){ if(!out[r.email]) out[r.email]={src:r.image,from:'keystone'} });
  return out;
}
async function mySigImage(){ var s=await sigImages([ME.email]); return s[ME.email]||null; }
async function peopleNames(emails){
  emails=emails.filter(Boolean); var out={}; if(!emails.length) return out;
  var r=await supa.rpc('adm_people_names',{p_emails:emails});
  (r.data||[]).forEach(function(x){ if(x.name) out[x.email]=x.name });
  return out;
}

/* ================= CANVASS =================

   VAT for a VAT supplier (input VAT is recovered), the full price for a non-VAT supplier, plus the
   line's share of the delivery fee. That figure comes from the database (adm_v_rfq_offers), the
   same one adm_pr_award checks, so the screen and the rule cannot disagree. */

  var r=await Promise.all([supa.from('adm_purchase_requests').select('*').eq('id',prId).maybeSingle(),
    supa.from('adm_pr_lines').select('*').eq('pr_id',prId).order('line_no'),

function awardOffer(lineId,offerId){
  var C=CANV, l=C.lines.filter(function(x){return x.id===lineId})[0]||{}, o=C.offers.filter(function(x){return x.id===offerId})[0]||{};
  var lo=C.offers.filter(function(x){return x.pr_line_id===lineId&&x.unit_price!=null});
  var min=Math.min.apply(null,lo.map(function(x){return Number(x.landed)}));
  var q=C.quotes.filter(function(x){return x.id===o.quote_id})[0]||{}, s=C.S[o.supplier_id]||{};
  var minq=Number(((CACHE.cfg&&CACHE.cfg.value)||{}).canvassMinQuotes)||3, why=[];
  if(lo.length<minq) why.push('only '+lo.length+' of '+minq+' quotes');
  if(Number(o.landed)>min) why.push('not the lowest price');
  if(['accredited','preferred'].indexOf(s.status)<0) why.push((s.name||'the supplier')+' is not accredited');
  if(q.vat_basis==='unknown') why.push('the quote does not say whether VAT is included');
  var go_=function(reason){ rpcPreview('adm_pr_award',{p_line_id:lineId,p_offer_id:offerId,p_reason:reason||null},'Choose supplier — review',function(){openCanvass(C.p.id)}); };
  if(!why.length) return go_(null);
  askText('Choose '+(s.name||'supplier')+' for '+(l.item_name||'this line'),'Reason',true,go_,{sub:'A reason is needed: '+esc(why.join('; '))+'. It is shown to the approvers.',ok:'Continue to review'});
}

/* ================= CANVASSING (Rommel, 2026-10-23) =================
   A canvass is a price check per quotation, done BEFORE the purchase request — nothing is bought here.
   Started from "Waiting for client approval" (or for an approved quotation), it collects supplier quotes
   per item (same quote engine as before: VAT-fair comparison, delivery share, AI reading, price history),
   one supplier is chosen per item, then it is submitted:
     - one supplier per item  -> approved straight away (existing, cheapest supplier)
     - two or more suppliers on any item -> Head of Plant Operations approves or returns it
   (the number is the CONFIG setting canvassHpoMinSuppliers, so the rule can change without code).
   An approved canvass waits under "For procurement"; "Create purchase request" copies the chosen suppliers
   and prices into a draft PR, which then goes through the normal chain. Buying (recording the Odoo PO) is
   refused by the database until the client approved the Final Quotation AND payment met the terms or was vouched. */
var CV_BY_SERIAL={}, CVF={tab:'open'}, CVD=null;
var CV_STATUS={open:['Canvassing','p-amber'],for_hpo:['Waiting for Head of Plant Ops','p-amber'],approved:['For procurement','p-green'],
  converted:['Purchase request made','p-teal'],cancelled:['Cancelled','p-grey']};

function cvCan(){return !!(ME.caps&&(ME.caps.can_source||ME.caps.can_request))}
function cvBtn(serial){
  var c=CV_BY_SERIAL[serial];

  return cvCan()?'<button class="ghost" data-act="cvStart" data-serial="'+esc(serial)+'" style="padding:3px 10px;font-size:12px"><i class="ti ti-scale"></i> Start canvassing</button>':'';

  var cvs=(r[0].data||[]).filter(function(c){return !isTestSerial(c.quotation_serial)||(KS_SHOW_TEST&&ksCanSeeTest())});
  var ids=cvs.map(function(c){return c.id}), LN=[], PR={}, BLK={};

var SUPS=[];
function supStatusLabel(s){ return {prospect:'Prospect',accredited:'Accredited',preferred:'Preferred',suspended:'Suspended',blacklisted:'Blacklisted'}[s]||s||'—'; }
function pillSup(s){
  var m={preferred:'p-green',accredited:'p-blue',prospect:'p-grey',suspended:'p-amber',blacklisted:'p-red'};
  return '<span class="pill '+(m[s]||'p-grey')+'">'+esc(supStatusLabel(s))+'</span>';
}
function supDocState(list){
  var today=new Date().toISOString().slice(0,10), in30=new Date(Date.now()+30*86400000).toISOString().slice(0,10), o={n:list.length,expired:0,soon:0};
  list.forEach(function(x){ if(!x.expires_on) return; if(x.expires_on<today) o.expired++; else if(x.expires_on<=in30) o.soon++; });
  return o;
}
function filterSup(){
  var q=el('supQ').value.toLowerCase(), st=el('supSt')?el('supSt').value:'';

    tr.style.display=ok?'':'none'});
}

/* Reads an Odoo export. Headers like "Order Lines/Partner" are matched on their last part. Two shapes:
   - purchase order lines (has a Partner/Vendor column): suppliers = the partners; their items keep the latest price;
   - vendor list (has a Name column).
   A file with neither is refused — never guess a column (the first version read dates as supplier names). */
// Our own companies stay in: WCL buys from Module System and Services (Rommel, 2026-10-18).
function supParseOdoo(aoa){
  if(!aoa||aoa.length<2) return {error:'The file is empty.'};
  var H=aoa[0].map(function(h){var x=String(h||'').toLowerCase().trim(); return x.split('/').pop().trim();});
  function col(re,not){ for(var i=0;i<H.length;i++){ if(re.test(H[i])&&!(not&&not.test(H[i]))) return i; } return -1; }
  function txt(v){ return v==null?'':String(v).trim(); }
  function iso(v){ if(v instanceof Date&&!isNaN(v)) return v.toISOString();
    var s=txt(v); if(!s) return ''; var m=s.match(/^(\d{4}-\d\d-\d\d)[ T](\d\d:\d\d(:\d\d)?)/); return m?m[1]+'T'+m[2]+'+08:00':(/^\d{4}-\d\d-\d\d$/.test(s)?s:''); }
  var part=col(/^(partner|vendor|supplier)$/);
  if(part>=0){
    var cP=col(/^product$/), cD=col(/^description$/), cU=col(/unit of measure|^uom$|^unit$/), cPr=col(/^unit price$|^price$/),
        cQ=col(/^quantity$|^qty$/), cDt=col(/created on|order date|^date/), cRef=col(/order reference|^reference$/);
    if(cPr<0) return {error:'This looks like purchase order lines, but there is no Unit Price column.'};
    var by={}, order=[], internal={}, lines=0;
    aoa.slice(1).forEach(function(r){
      var sup=txt(r[part]); if(!sup) return;
      // Column E (Product) is often only an expense category ("Factory Supplies", "Office Supplies",
      // "Repairs & Maintenance…"); the real item is the Description (F). Use F, keep E as its category.
      var prodE=txt(cP>=0?r[cP]:''), descF=txt(cD>=0?r[cD]:'').split(/\r?\n/), dTop=(descF[0]||'').trim(), dRest=descF.slice(1).join(' ').replace(/\s+/g,' ').trim();
      var item=dTop||prodE, cat=(prodE&&dTop&&prodE.toLowerCase()!==dTop.toLowerCase()&&!/\d/.test(prodE))?prodE:'';
      var price=parseFloat(r[cPr]), qty=cQ>=0?parseFloat(r[cQ]):1;
      if(!by[sup]){ by[sup]={name:sup,products:{}}; order.push(sup); }
      if(!item||!(qty>0)||/amount adjustment/i.test(item)) return;
      if(!(price>0)) price=null;   // some exports carry 0 for the price; keep the item, record no price
      lines++;
      var unit=txt(cU>=0?r[cU]:''), dt=iso(cDt>=0?r[cDt]:''), k=item.toLowerCase()+'|'+unit.toLowerCase(), cur=by[sup].products[k];
      if(!cur||(price!=null&&(cur.price==null||(dt&&(!cur.date||dt>cur.date))))) by[sup].products[k]={item:item,unit:unit,price:price,date:dt,category:cat,
        note:[cRef>=0&&txt(r[cRef])?'Last bought on '+txt(r[cRef]).split(' ')[0]:'',dRest].filter(Boolean).join(' — ').slice(0,300)};
    });
    var rows=order.map(function(n){var s=by[n]; return {name:s.name,products:Object.keys(s.products).map(function(k){return s.products[k]})}});
    if(!rows.length) return {error:'No suppliers found in the Partner column.'};
    return {mode:'lines',rows:rows,lineCount:lines,internal:Object.keys(internal)};
  }
  var c={ref:col(/^(external )?id$/),name:col(/^(display name|name|company name|vendor name)$/),
    phone:col(/^phone/),mobile:col(/mobile/),email:col(/e-?mail/),tin:col(/tax id|^vat$|^tin$/),street:col(/^street$/),
    street2:col(/street2|street 2/),city:col(/^city/),country:col(/^country/),web:col(/website/),
    terms:col(/payment term/),contact:col(/contact person|^contact$/),tags:col(/tags|categor/)};
  if(c.name<0) return {error:'No supplier column found. Use a vendor list with a Name column, or purchase order lines with a Partner column.'};
  var out=[];
  aoa.slice(1).forEach(function(r){
    var g=function(k){return c[k]>=0?txt(r[c[k]]):''};
    var nm=g('name'); if(!nm) return;
    out.push({name:nm,odoo_ref:g('ref'),contact_phone:g('phone')||g('mobile'),contact_email:g('email'),tin:g('tin'),
      address:[g('street'),g('street2')].filter(Boolean).join(', '),city:g('city'),country:g('country'),website:g('web'),
      payment_terms:g('terms'),contact_person:g('contact'),
      categories:g('tags')?g('tags').split(/[,;]/).map(function(x){return x.trim()}).filter(Boolean):[]});
  });
  if(!out.length) return {error:'No supplier names found in the Name column.'};
  return {mode:'vendors',rows:out};
}

var _mrOpen=null;
async function mrLines(id){
  var m=await supa.from('adm_material_requests').select('*').eq('id',id).maybeSingle();
  var q=await supa.from('adm_mr_lines').select('*').eq('mr_id',id).order('line_no');
  var mr=m.data||{}, rows=q.data||[];
  var canIssue=!!ME.caps.can_issue&&['authorized','partially_issued','issued','partially_received'].indexOf(mr.status)>=0;
  _mrOpen={id:id,lines:rows};
  openModal('<h3>Material request '+esc(mr.mr_no||'')+' '+pill(mr.status)+'</h3>'+
    '<p class="sub">'+esc(mr.stream==='purchase'?'Purchase stream — outsourced / made-to-order items; process them when they arrive.':'Warehouse stream — stocked materials to withdraw.')+
    ' The warehouse confirms what it processed here; production confirms what it received in PMES.</p>'+
    (rows.length?'<table><thead><tr><th>#</th><th>Item</th><th>Unit</th><th class="num">Requested</th>'+
      '<th class="num">Processed</th><th class="num">Received</th><th>Sourcing</th><th class="num">Lead</th></tr></thead><tbody>'+
      rows.map(function(l){return '<tr><td>'+num(l.line_no)+'</td>'+
        '<td>'+esc(l.item_name)+'<div class="mini">'+esc(l.area||'')+'</div></td>'+
        '<td>'+esc(l.unit||'')+'</td><td class="num">'+num(l.qty)+'</td>'+
        '<td class="num">'+(canIssue?'<input type="number" min="'+(+l.qty_received||0)+'" max="'+l.qty+'" step="any" id="mrIss_'+esc(l.id)+'" value="'+(l.qty_issued!=null?l.qty_issued:'')+'" placeholder="0" style="width:80px;text-align:right">':num(l.qty_issued))+'</td>'+
        '<td class="num">'+num(l.qty_received)+'</td>'+
        '<td>'+pill(l.sourcing)+'</td>'+
        '<td class="num">'+(l.mto_lead_days!=null?l.mto_lead_days+'d':'—')+'</td></tr>'}).join('')+
      '</tbody></table>':'<div class="empty">No lines.</div>')+
    (canIssue?'<div class="row" style="margin-top:10px;gap:8px"><input id="mrIssNote" placeholder="Note (optional)" style="flex:1">'+
      '<button class="ghost" id="mrIssAll">Fill all as requested</button></div>':'')+
    (!ME.caps.can_issue&&['authorized','partially_issued'].indexOf(mr.status)>=0?'<div class="info" style="margin-top:10px">Waiting for the warehouse to process it. (Only people with the warehouse <b>Issue</b> capability can confirm.)</div>':'')+
    '<div class="row right" style="margin-top:14px;gap:8px">'+
      (canIssue?'<button class="primary" data-act="mrProcess" data-id="'+esc(id)+'">Confirm processed</button>':'')+
      '<button data-act="closeModal">Close</button></div>');
  var fill=el('mrIssAll'); if(fill) fill.onclick=function(){ rows.forEach(function(l){ var i=el('mrIss_'+l.id); if(i) i.value=l.qty; }); };
}
async function mrProcess(id){
  if(!_mrOpen||_mrOpen.id!==id) return;
  var lines=[];
  for(var i=0;i<_mrOpen.lines.length;i++){
    var l=_mrOpen.lines[i], inp=el('mrIss_'+l.id); if(!inp) continue;
    var v=inp.value===''?0:Number(inp.value);
    if(!(v>=0)){ toast('Line '+l.line_no+': enter a quantity.','err'); return; }
    lines.push({id:l.id,qty:v});
  }
  var r=await supa.rpc('adm_mr_process',{p_mr:id,p_lines:lines,p_note:(el('mrIssNote')||{}).value||null});
  if(r.error){ toast(r.error.message,'err'); return; }
  toast('Processed — '+statusLabel(r.data.status)+' ('+num(r.data.issued)+' of '+num(r.data.requested)+').','ok');
  closeModal(); render();
}

/* ================= BOARD REQUESTS (from PMES) =================
   Production asks for additional boards when received boards are rejected or defective and the
   re-run cutting plan comes up short. PMES: supervisor, then manager, approve; then it lands here.
   Accept -> it becomes a warehouse MRF (processed and received like any other). Reject -> PMES may
   escalate to the Head of Plant Operations, whose decision is final. */
async function viewBoardReqs(){
  var _vs=render._seq;   // this page's ticket — see VIEW()
  VIEW(_vs).innerHTML='<div class="empty">Loading board requests…</div>';
  var q=await supa.from('pmes_board_requests').select('*').order('created_at',{ascending:false}).limit(200);
  if(q.error) throw q.error;
  var rows=(q.data||[]).filter(function(r){ return ['pending_supervisor','pending_manager','cancelled'].indexOf(r.status)<0; });
  var canDecide=!!(ME.caps.can_issue||ME.caps.can_release), isHead=!!ME.caps.is_plant_head;
  var mq=rows.filter(function(r){return r.mr_id}).length?await supa.from('adm_material_requests').select('id,mr_no,status').in('id',rows.filter(function(r){return r.mr_id}).map(function(r){return r.mr_id})):{data:[]};
  var mrNo={}; (mq.data||[]).forEach(function(m){mrNo[m.id]=m});
  VIEW(_vs).innerHTML='<div class="card"><h3>Extra board requests</h3>'+
    '<div class="info" style="margin-bottom:8px"><b>What this is for:</b> the job\'s boards already came with its first Material request. '+
    'This list is only for <b>additional</b> boards production needs later — when boards that arrived are rejected or have defects and the cutting plan comes up short.</div>'+
    '<p class="sub">Additional boards asked for by production after inspecting what arrived (rejected or defective boards). '+
    'Approved in PMES by a supervisor and a manager before reaching here. <b>Accept</b> raises a warehouse MRF; '+
    '<b>Reject</b> sends it back — production may escalate it to the <b>Head of Plant Operations</b>, whose decision is final.</p>'+
    (rows.length?listBar('boards','Search job, quotation, client, reason…')+'<div class="mini" data-lfn="boards"></div>'+
      '<table data-lft="boards"><thead><tr><th>Job</th><th>Boards</th><th>Why</th><th>Status</th><th>Trail</th><th>Raised MRF</th><th></th></tr></thead><tbody>'+
      rows.map(function(r){
        var trail=[r.supervisor_by&&('Supervisor '+r.supervisor_by),r.manager_by&&('Manager '+r.manager_by),
          r.ks_by&&('KEYSTONE '+r.ks_by+(r.ks_note?': '+r.ks_note:'')),r.escalated_by&&('Escalated by '+r.escalated_by+': '+r.escalate_note),
          r.head_by&&('Head of Plant Ops '+r.head_by+': '+r.head_note)].filter(Boolean).map(esc).join('<br>');
        var act='';
        if(r.status==='sent_to_keystone'&&canDecide) act='<button class="primary" data-act="brDecide" data-id="'+esc(r.id)+'" data-ok="1">Accept</button> '+
          '<button data-act="brDecide" data-id="'+esc(r.id)+'" data-ok="0">Reject</button>';
        if(r.status==='escalated'&&isHead) act='<button class="primary" data-act="brFinal" data-id="'+esc(r.id)+'" data-ok="1">Approve</button> '+
          '<button data-act="brFinal" data-id="'+esc(r.id)+'" data-ok="0">Reject</button>';
        if(r.status==='escalated'&&!isHead) act='<span class="mini">Waiting for the Head of Plant Operations</span>';
        return '<tr'+rowAttrs([r.job_code,r.quotation_serial,r.reason,r.status],r.company)+'><td><b>'+esc(r.job_code||'—')+'</b><div class="mini">'+esc(r.quotation_serial||'')+'<br>'+esc(r.company||'')+'</div>'+qLabel(r.quotation_serial)+'</td>'+
          '<td>'+(r.lines||[]).map(function(l){return num(l.qty)+' × '+esc(l.label);}).join('<br>')+'</td>'+
          '<td>'+esc(r.reason)+'<div class="mini">'+esc(r.created_by_name||r.created_by)+' · '+dt(r.created_at)+'</div></td>'+
          '<td>'+pill(r.status)+'</td><td class="mini">'+trail+'</td><td>'+(r.mr_id&&mrNo[r.mr_id]?'<b>'+esc(mrNo[r.mr_id].mr_no||'')+'</b><div>'+pill(mrNo[r.mr_id].status)+'</div>':'<span class="mini">—</span>')+'</td><td class="num" style="white-space:nowrap">'+act+'</td></tr>';
      }).join('')+'</tbody></table>'
     :'<div class="empty">No extra board requests yet.</div>')+'</div>';
}
function brDecide(id,accept){
  askText(accept?'Accept board request':'Reject board request',accept?'Note for production':'Why is it rejected',!accept,function(note){_brDecide(id,accept,note)},
    {sub:accept?'Accepting raises a warehouse material request for the boards.':'Production may escalate a rejection to the Head of Plant Operations.',danger:!accept,ok:accept?'Accept':'Reject'});
}
async function _brDecide(id,accept,note){
  var r=await supa.rpc('adm_board_request_decide',{p_req:id,p_accept:accept,p_note:note||null});
  if(r.error){toast(errMsg(r.error),'err');return}
  toast(accept?'Accepted — a warehouse MRF was raised.':'Rejected — production can escalate it.','ok'); render();
}
function brFinal(id,approve){

    {sub:'As Head of Plant Operations your decision is final.',danger:!approve,ok:approve?'Approve':'Reject'});
}
async function _brFinal(id,approve,note){
  var r=await supa.rpc('adm_board_request_final',{p_req:id,p_approve:approve,p_note:note});
  if(r.error){toast(errMsg(r.error),'err');return}
  toast(approve?'Approved — a warehouse MRF was raised.':'Rejected — final.','ok'); render();
}

async function viewDash(){
  var _vs=render._seq;   // this page's ticket — see VIEW()

  var g=await supa.from('adm_release_gates').select('*');

  var gates=(g.data||[]).filter(function(x){return !isTestSerial(x.quotation_serial)}),
      prs=(p.data||[]).filter(function(x){return !isTestSerial(x.quotation_serial)});
  var due=gates.reduce(function(a,x){return a+(Number(x.amount_due)||0)},0);
  var paid=gates.reduce(function(a,x){return a+(Number(x.amount_paid)||0)},0);
  var bal=due-paid;
  var rel=gates.filter(function(x){return x.gate_status==='released'});
  var pend=gates.filter(function(x){return x.gate_status==='pending_payment'});
  // Vouched = released on a vouch (a vouched gate becomes "released" once unlocked).
  var vou=gates.filter(function(x){return x.vouched_by&&x.gate_status==='released'});
  var owing=rel.filter(function(x){return Number(x.balance)>0});
  // Real open statuses (the old list named statuses that do not exist, so the tile under-counted).

  var prVal=prs.filter(function(x){return x.status==='approved'})
    .reduce(function(a,x){return a+(Number(x.est_total)||0)},0);

  // Average days from gate opened to released — the real cash-to-production cycle.
  var cyc=rel.filter(function(x){return x.released_at&&x.created_at})
    .map(function(x){return (new Date(x.released_at)-new Date(x.created_at))/86400000});

  await refreshNeeds(true);

    ['awaiting_payment','Awaiting payment','record a payment or vouch','queue'],

    ['pr_to_approve','Requests to approve','purchase requests waiting for you','appr'],
    ['my_drafts','My drafts','purchase requests to review and sign','review'],
    ['po_to_act','Ready for Odoo','approved requests waiting for an Odoo PO','po'],
    ['mr_to_process','Materials to process','warehouse: confirm what was issued','mr'],
    ['boards_to_decide','Extra board requests','extra boards waiting for a decision','boards'],
    ['sched_to_sign','Schedules to sign','delivery schedules waiting for your signature','lg_sched'],
    ['msgs_unread','Client replies','unread client messages in HATID','lg_msgs']];
  try{ await Promise.race([lgLoad(false,LG.ov?LG.ov.today:null),new Promise(function(ok){setTimeout(ok,4000)})]); lgNeedCounts() }catch(e){}
  var needs=tiles.filter(function(t){return N[t[0]]>0});
  VIEW(_vs).innerHTML=
    '<div class="card needs"><h3>Needs you</h3>'+
    (needs.length?'<p class="sub">What is waiting for you now. Click a tile to go there.</p><div class="grid g4">'+
      needs.map(function(t){return '<div class="kpi act" data-act="go" data-tab="'+t[3]+'"><div class="lbl">'+esc(t[1])+'</div>'+
        '<div class="val">'+N[t[0]]+'</div><div class="hint">'+esc(t[2])+'</div></div>'}).join('')+'</div>'
     :'<div class="empty">Nothing is waiting for you.</div>')+'</div>'+
    lgDashCard()+
    '<div class="card"><h3>Dashboard &amp; KPI</h3>'+
    '<p class="sub">Figures below cover only what this app manages. Each gate is shown on its own — '+
    'quotation amounts are never merged into a single combined figure.</p>'+
    '<div class="grid g4">'+
      kpi('Contract value under gate',money(due),gates.length+' gate(s)')+
      kpi('Collected',money(paid),due>0?(paid/due*100).toFixed(1)+'% of contract':'')+
      kpi('Outstanding balance',money(bal),'across all open gates')+
      kpi('Released to production',rel.length,'Job Orders unlocked')+
    '</div><div class="grid g4" style="margin-top:12px">'+
      kpi('Awaiting payment',pend.length,'blocked from production')+
      kpi('Released on a vouch',vou.length,'released before the terms were met')+
      kpi('Open purchase requests',prOpen.length,'canvassing or awaiting approval')+
      kpi('Approved PR value',money(prVal),'committed to suppliers')+
    '</div><div class="grid g4" style="margin-top:12px">'+
      kpi('Avg. gate → release',avgCyc!=null?avgCyc.toFixed(1)+' days':'—','cash-to-production cycle')+
      kpi('Auto-generated PRs',prs.filter(function(x){return x.auto_generated}).length,'from outsource rows')+
      kpi('Suppliers on file',(CACHE.supCount!=null?CACHE.supCount:'—'),'sourcing base')+
      kpi('Unpaid on released jobs',money(owing.reduce(function(a,x){return a+(Number(x.balance)||0)},0)),owing.length+' released job(s) still owing')+
    '</div></div>'+
    '<div class="card"><h3>Gate status breakdown</h3>'+
